<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Victor 9000</title>
<style>
  body { background: #181818; color: #eee; font: 16px sans-serif; }
  canvas { display: block; max-width: 100%; margin-top: 1rem; }
  pre { white-space: pre-wrap; }
  #audio { margin-left: 1rem; font-size: 14px; color: #aaa; }
</style>

<button id="start">Start Victor 9000</button>
<label id="audio">Volume <input id="vol" type="range" min="0" max="8" step="0.25" value="4"></label>
<canvas id="canvas" tabindex="0"
        oncontextmenu="event.preventDefault()"></canvas>
<pre id="log"></pre>

<script>
var Module;
const screen = document.getElementById("canvas");
const log = text => {
  document.getElementById("log").textContent += text + "\n";
};

// Add separate device ROM archives here if required.
const romFiles = ["victor9k.zip", "victor9k_kb.zip", "victor9k_fdc.zip"];
const bootDisk = "startrek.img";

// --- Audio ---------------------------------------------------------------
// MAME's stock web audio (jsmame_web_audio) has two problems:
//  * it creates its AudioContext lazily from inside the emulation loop, not a
//    user gesture, so strict autoplay policies leave it suspended;
//  * it plays through a ScriptProcessorNode, whose callback runs on the MAIN
//    thread - the same thread running the emulator. Any long frame or GC pause
//    delays the callback and the output glitches. Native MAME has an audio
//    thread; this is the main reason the browser build stutters.
// So: create the context in the click handler, and replace the sink with an
// AudioWorklet (runs on the audio rendering thread with its own queue).
// MAME's C++ side calls the global jsmame_stream_sink_update(ptr, frames)
// with interleaved stereo int16 at -samplerate; we copy and post each chunk.

const WORKLET_SRC = `
class V9kSink extends AudioWorkletProcessor {
  constructor() {
    super();
    this.buf = new Float32Array(sampleRate * 2 * 2);   // 2 s stereo ring
    this.r = 0; this.w = 0; this.fill = 0;              // fill in frames
    this.consumed = 0; this.underruns = 0; this.primed = false;
    this.port.onmessage = e => {
      const d = e.data, b = this.buf, n = b.length;
      for (let i = 0; i < d.length; i++) { b[this.w] = d[i]; this.w = (this.w + 1) % n; }
      this.fill += d.length >> 1;
      if (this.fill > n >> 1) {                         // overflow: drop oldest
        const drop = this.fill - (n >> 1);
        this.r = (this.r + drop * 2) % n; this.fill -= drop;
      }
    };
  }
  process(inputs, outputs) {
    const L = outputs[0][0], R = outputs[0][1] || L, b = this.buf, n = b.length;
    const frames = L.length;
    if (!this.primed && this.fill < frames * 8) return true;   // wait for a cushion
    this.primed = true;
    const take = Math.min(frames, this.fill);
    for (let i = 0; i < take; i++) { L[i] = b[this.r]; R[i] = b[this.r + 1]; this.r = (this.r + 2) % n; }
    if (take < frames) { this.underruns++; this.primed = false; }
    this.fill -= take; this.consumed += take;
    if ((currentFrame & 1023) < frames)                 // ~every 23 ms
      this.port.postMessage({ consumed: this.consumed, underruns: this.underruns });
    return true;
  }
}
registerProcessor("v9k-sink", V9kSink);
`;

const SCALE = 1 / 32768;
const audio = {
  ctx: null, gain: null, node: null,
  sent: 0, consumed: 0, underruns: 0, backlog: [],
  queued() { return this.node ? this.sent - this.consumed : -1; },   // frames
  post(chunk) {
    if (this.node) { this.sent += chunk.length >> 1; this.node.port.postMessage(chunk, [chunk.buffer]); }
    else this.backlog.push(chunk);
  }
};

function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  const ctx = audio.ctx = new AC();
  audio.gain = ctx.createGain();
  audio.gain.gain.value = +document.getElementById("vol").value;
  const limiter = ctx.createDynamicsCompressor();      // keep the boost from clipping
  limiter.threshold.value = -3; limiter.knee.value = 0; limiter.ratio.value = 20;
  limiter.attack.value = 0.002; limiter.release.value = 0.1;
  audio.gain.connect(limiter).connect(ctx.destination);
  for (const ev of ["pointerdown", "keydown"])
    document.addEventListener(ev, () => ctx.state !== "running" && ctx.resume(), true);
  ctx.resume();

  const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: "text/javascript" }));
  ctx.audioWorklet.addModule(url).then(() => {
    const node = new AudioWorkletNode(ctx, "v9k-sink", { numberOfInputs: 0, outputChannelCount: [2] });
    node.port.onmessage = e => { audio.consumed = e.data.consumed; audio.underruns = e.data.underruns; };
    node.connect(audio.gain);
    audio.node = node;
    for (const c of audio.backlog.splice(0)) audio.post(c);
  }).catch(err => log("AudioWorklet unavailable: " + err));

  // Take over MAME's sink. victor9k.js assigns these globals when it loads,
  // so make the properties ignore that assignment.
  const sink = (ptr, frames) => {
    const src = HEAP16.subarray(ptr >> 1, (ptr >> 1) + frames * 2);
    const out = new Float32Array(src.length);
    for (let i = 0; i < src.length; i++) out[i] = src[i] * SCALE;
    audio.post(out);
  };
  Object.defineProperty(window, "jsmame_stream_sink_update", { get: () => sink, set() {} });
  Object.defineProperty(window, "jsmame_sample_count", { get: () => () => audio.queued() * 2, set() {} });
  return ctx;
}
document.getElementById("vol").oninput = e => {
  if (audio.gain) audio.gain.gain.value = +e.target.value;
};

// --- Pace emulation off the audio clock ------------------------------------
// MAME's emscripten loop emulates a fixed 1/60 s per requestAnimationFrame
// callback and relies on MAME's throttle (a busy-wait on a single-threaded
// page) to hold real time. Run with -nothrottle instead, and on each display
// frame run as many 1/60 s steps as needed to keep the worklet's queue at
// AUDIO_TARGET_MS (none when it's already full), within a CPU budget.
const AUDIO_TARGET_MS = 120;
const MAX_STEPS = 4, BUDGET_MS = 12;
const realRAF = window.requestAnimationFrame.bind(window);
let pending = null, scheduled = false;
window.requestAnimationFrame = cb => {
  pending = cb;
  if (!scheduled) { scheduled = true; realRAF(pump); }
  return 0;
};
function pump(t) {
  scheduled = false;
  const t0 = performance.now();
  const target = audio.ctx ? audio.ctx.sampleRate * AUDIO_TARGET_MS / 1000 : 0;
  for (let n = 0; pending && n < MAX_STEPS; n++) {
    const q = audio.queued();
    if (q < 0 ? n > 0 : q > target) break;           // no audio yet: 1 step/frame
    if (n > 0 && performance.now() - t0 > BUDGET_MS) break;
    const cb = pending; pending = null;
    cb(t);                                          // MAME re-arms via our shim
  }
  if (pending && !scheduled) { scheduled = true; realRAF(pump); }
}

document.getElementById("start").onclick = async function () {
  this.disabled = true;
  const ctx = initAudio();            // must happen synchronously in the click
  log("Loading ROMs and boot disk…");

  try {
    const files = await Promise.all(
      [...romFiles, bootDisk].map(async name => {
        const response = await fetch(name);
        if (!response.ok) throw new Error(`${name}: HTTP ${response.status}`);
        return [name, new Uint8Array(await response.arrayBuffer())];
      })
    );

    Module = {
      canvas: screen,
      arguments: [
        "victor9k",
        "-rompath", "/",
        "-hard", "/" + bootDisk,
        "-video", "accel",
        "-renderdriver", "software",
        "-ram", "896k",
        "-window",
        "-resolution", "800x600",
        "-skip_gameinfo",
        "-nothrottle",            // pacing is done by the audio-driven pump above
        // MAME defaults to 48 kHz; the JS sink plays whatever it gets at the
        // context's rate, so mismatches overflow its ring buffer and drop audio.
        "-samplerate", String(ctx ? ctx.sampleRate : 48000),
        // Interim display fix (see notes): lift low-intensity text without
        // raising black. Remove once the driver's palette is corrected.
        "-contrast", "2.0",
        "-gamma", "1.6"
      ],
      print: log,
      printErr: log,
      onAbort: reason => log("Aborted: " + reason),
      preRun: [function () {
        for (const [name, bytes] of files) {
          Module.FS_createDataFile("/", name, bytes, true, true);
        }
      }]
    };

    const script = document.createElement("script");
    script.src = "victor9k.js";
    script.onerror = () => log("Could not load victor9k.js");
    document.body.appendChild(script);
    screen.focus();
  } catch (error) {
    log(error.message);
    this.disabled = false;
  }
};
</script>
</html>
