<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Victor 9000</title>
<style>
  body { background: #181818; color: #eee; font: 16px sans-serif; }
  canvas { display: block; max-width: 100%; margin-top: 1rem; }
  pre { white-space: pre-wrap; }
</style>

<button id="start">Start Victor 9000</button>
<canvas id="canvas" tabindex="0"
        oncontextmenu="event.preventDefault()"></canvas>
<pre id="log"></pre>

<script>
var Module;
const screen = document.getElementById("canvas");
const log = text => {
  document.getElementById("log").textContent += text + "\n";
};

// Add separate device ROM archives here if required.
const romFiles = ["victor9k.zip", "victor9k_kb.zip", "victor9k_fdc.zip"];
const bootDisk = "startrek.img";

document.getElementById("start").onclick = async function () {
  this.disabled = true;
  log("Loading ROMs and boot disk…");

  try {
    const files = await Promise.all(
      [...romFiles, bootDisk].map(async name => {
        const response = await fetch(name);
        if (!response.ok) throw new Error(`${name}: HTTP ${response.status}`);
        return [name, new Uint8Array(await response.arrayBuffer())];
      })
    );

    Module = {
      canvas: screen,
      arguments: [
        "victor9k",
        "-rompath", "/",
        "-hard", "/" + bootDisk,
        "-video", "accel",
        "-renderdriver", "software",
        "-ram", "896k",
        "-window",
        "-resolution", "800x600",
        "-skip_gameinfo"
      ],
      print: log,
      printErr: log,
      onAbort: reason => log("Aborted: " + reason),
      preRun: [function () {
        for (const [name, bytes] of files) {
          Module.FS_createDataFile("/", name, bytes, true, true);
        }
      }]
    };

    const script = document.createElement("script");
    script.src = "victor9k.js";
    script.onerror = () => log("Could not load victor9k.js");
    document.body.appendChild(script);
    screen.focus();
  } catch (error) {
    log(error.message);
    this.disabled = false;
  }
};
</script>
</html>
